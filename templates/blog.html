{% extends "base.html" %}
{% block content %}
<div class="blog-headers">
    <h1>Blog</h1>
    <h2>ブログ</h2>
</div>

<div class="posts-list">
    <hr class="line-break">
    {% for post in posts %}
    <a href="{{ url_for('blog_post', slug=post.slug) }}" class="post-card">
        {% if post.image %}
        <img src="{{ post.image }}" alt="{{ post.image_alt or post.title }}" class="post-thumb">
        {% endif %}
        <h2>{{ post.title }}</h2>
        <p class="post-meta">{{ post.date.strftime('%B %d, %Y') }} · {{ post.author }}</p>
    </a>
    <hr class="line-break">
    {% endfor %}
</div>
{% endblock %}
