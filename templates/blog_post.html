{% extends "base.html" %}
{% block content %}
<article class="blog-post">
    <h1>{{ post.title }}</h1>

    {% if post.sub_image %}
    <figure class="post-hero">
        <img src="{{ post.sub_image }}" alt="{{ post.sub_image_alt or post.title }}">
        {% if post.sub_image_credit %}
        <figcaption>{{ post.sub_image_alt }}</figcaption>
        {% endif %}
    </figure>
    {% endif %}
    <p class="post-meta">{{ post.date.strftime('%B %d, %Y') }} · {{ post.author }}</p>

    <div class="post-content">
        {{ post.content|safe }}
    </div>

    <a href="{{ url_for('blog') }}" class="back-link">← Back to Blog</a>
</article>
{% endblock %}
